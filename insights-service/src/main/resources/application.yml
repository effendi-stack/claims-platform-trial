server:
  port: 8082

spring:
  application:
    name: insights-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/claims_platform}
    username: ${DB_USER:insights_svc}
    password: ${DB_PASSWORD:insights_svc}
    hikari:
      schema: insights
  flyway:
    schemas: insights
    default-schema: insights
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: insights-service
      # A brand-new insights deployment replays the whole topic to build its tables.
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    # producer is only used to publish poison messages to the dead-letter topic
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

security:
  jwt:
    # same signing secret as claims-service (which issues the tokens)
    secret: ${JWT_SECRET:dev-only-signing-secret-change-me-0123456789abcdef}

insights:
  kafka:
    topic: claims.events
    dead-letter-topic: claims.events.insights.DLT

springdoc:
  # JSON, not */*: otherwise generated clients treat every response body as a binary blob
  default-produces-media-type: application/json
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
