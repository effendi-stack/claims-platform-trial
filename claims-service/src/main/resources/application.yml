server:
  port: 8081

spring:
  application:
    name: claims-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/claims_platform}
    username: ${DB_USER:claims_svc}
    password: ${DB_PASSWORD:claims_svc}
    hikari:
      # unqualified SQL (JdbcTemplate) resolves to our schema in every environment
      schema: claims
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks the entities match it.
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: claims
  flyway:
    schemas: claims
    default-schema: claims
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: claims-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

security:
  jwt:
    # Shared with insights-service so both can validate the same token. Dev value only.
    secret: ${JWT_SECRET:dev-only-signing-secret-change-me-0123456789abcdef}
    ttl: PT8H
  dev-login:
    enabled: true

claims:
  kafka:
    topic: claims.events
    partitions: 6

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
